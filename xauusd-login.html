<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XAUUSD 課程學員登入</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-dark: #0b0f14;
      --bg-card: rgba(18, 24, 33, 0.85);
      --gold: #d4af37;
      --gold-light: #f0d78c;
      --gold-dark: #b8860b;
      --text: #e8e6e3;
      --text-muted: #9ca3af;
      --border: rgba(212, 175, 55, 0.25);
      --input-bg: rgba(255, 255, 255, 0.04);
      --error: #f87171;
      --success: #34d399;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-dark);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* 背景裝飾 */
    .bg-pattern {
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(ellipse 80% 50% at 20% 40%, rgba(212, 175, 55, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse 60% 40% at 80% 60%, rgba(184, 134, 11, 0.06) 0%, transparent 50%),
        linear-gradient(180deg, #0b0f14 0%, #111827 100%);
      z-index: 0;
    }

    .bg-grid {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(212, 175, 55, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(212, 175, 55, 0.03) 1px, transparent 1px);
      background-size: 48px 48px;
      z-index: 0;
      mask-image: radial-gradient(ellipse at center, black 20%, transparent 70%);
    }

    /* 金色光暈 */
    .glow {
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.12) 0%, transparent 70%);
      filter: blur(40px);
      z-index: 0;
      pointer-events: none;
    }

    .glow-1 { top: -100px; left: -100px; }
    .glow-2 { bottom: -150px; right: -100px; width: 500px; height: 500px; }

    /* 登入卡片 */
    .login-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }

    .login-card {
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 36px;
      box-shadow: 
        0 25px 50px -12px rgba(0, 0, 0, 0.5),
        0 0 0 1px rgba(212, 175, 55, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    /* Logo / 標題區 */
    .logo-area {
      text-align: center;
      margin-bottom: 36px;
    }

    .logo-icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 16px;
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(212, 175, 55, 0.35);
      position: relative;
    }

    .logo-icon::after {
      content: '';
      position: absolute;
      inset: 2px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .logo-icon svg {
      width: 28px;
      height: 28px;
      fill: #0b0f14;
    }

    .logo-area h1 {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--text);
      margin-bottom: 6px;
    }

    .logo-area p {
      font-size: 0.875rem;
      color: var(--text-muted);
      font-weight: 400;
    }

    /* 表單 */
    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 8px;
      letter-spacing: 0.01em;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper .icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      color: var(--text-muted);
      pointer-events: none;
      transition: color 0.2s;
    }

    .input-wrapper input {
      width: 100%;
      padding: 13px 14px 13px 44px;
      background: var(--input-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      color: var(--text);
      font-size: 0.9375rem;
      font-family: inherit;
      outline: none;
      transition: all 0.25s ease;
    }

    .input-wrapper input::placeholder {
      color: #6b7280;
    }

    .input-wrapper input:focus {
      border-color: var(--gold);
      background: rgba(212, 175, 55, 0.06);
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.12);
    }

    .input-wrapper input:focus + .icon,
    .input-wrapper:focus-within .icon {
      color: var(--gold);
    }

    /* 密碼顯示切換 */
    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
    }

    .toggle-password:hover {
      color: var(--gold);
    }

    .toggle-password svg {
      width: 18px;
      height: 18px;
    }

    /* 記住我 + 忘記密碼 */
    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
      font-size: 0.8125rem;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      color: var(--text-muted);
      user-select: none;
    }

    .remember input {
      width: 16px;
      height: 16px;
      accent-color: var(--gold);
      cursor: pointer;
    }

    .forgot {
      color: var(--gold);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }

    .forgot:hover {
      color: var(--gold-light);
    }

    /* 登入按鈕 */
    .btn-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
      border: none;
      border-radius: 12px;
      color: #0b0f14;
      font-size: 1rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 4px 16px rgba(212, 175, 55, 0.3);
      position: relative;
      overflow: hidden;
    }

    .btn-login:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 24px rgba(212, 175, 55, 0.4);
    }

    .btn-login:active {
      transform: translateY(0);
    }

    .btn-login:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .btn-login .spinner {
      display: none;
      width: 20px;
      height: 20px;
      border: 2px solid transparent;
      border-top-color: #0b0f14;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto;
    }

    .btn-login.loading .btn-text {
      display: none;
    }

    .btn-login.loading .spinner {
      display: block;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* 提示訊息 */
    .message {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 0.875rem;
      text-align: center;
      display: none;
    }

    .message.error {
      display: block;
      background: rgba(248, 113, 113, 0.12);
      border: 1px solid rgba(248, 113, 113, 0.3);
      color: var(--error);
    }

    .message.success {
      display: block;
      background: rgba(52, 211, 153, 0.12);
      border: 1px solid rgba(52, 211, 153, 0.3);
      color: var(--success);
    }

    /* 底部提示 */
    .footer-note {
      text-align: center;
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 0.8125rem;
      color: var(--text-muted);
    }

    .footer-note a {
      color: var(--gold);
      text-decoration: none;
      font-weight: 500;
    }

    .footer-note a:hover {
      color: var(--gold-light);
    }

    /* 響應式 */
    @media (max-width: 480px) {
      .login-card {
        padding: 32px 24px;
      }

      .logo-area h1 {
        font-size: 1.35rem;
      }
    }
  </style>
</head>
<body>
  <div class="bg-pattern"></div>
  <div class="bg-grid"></div>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>

  <div class="login-wrapper">
    <div class="login-card">
      <div class="logo-area">
        <div class="logo-icon">
          <!-- 簡化的黃金/圖表圖示 -->
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L3 7v2h18V7L12 2zm0 2.2L17.5 7H6.5L12 4.2zM5 11v8h2v-8H5zm4 0v8h2v-8H9zm4 0v8h2v-8h-2zm4 0v8h2v-8h-2zM3 21h18v2H3v-2z"/>
          </svg>
        </div>
        <h1>XAUUSD 課程學員</h1>
        <p>請登入以繼續學習</p>
      </div>

      <form id="loginForm" autocomplete="on">
        <div class="form-group">
          <label for="username">帳號 / 電子郵件</label>
          <div class="input-wrapper">
            <input
              type="text"
              id="username"
              name="username"
              placeholder="請輸入帳號或 Email"
              required
              autocomplete="username"
            />
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
          </div>
        </div>

        <div class="form-group">
          <label for="password">密碼</label>
          <div class="input-wrapper">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="請輸入密碼"
              required
              autocomplete="current-password"
            />
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <button type="button" class="toggle-password" id="togglePassword" aria-label="顯示密碼">
              <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="form-options">
          <label class="remember">
            <input type="checkbox" id="remember" name="remember" />
            記住我
          </label>
          <a href="javascript:void(0)" class="forgot" id="forgotLink" role="button">忘記密碼？</a>
        </div>

        <button type="submit" class="btn-login" id="loginBtn">
          <span class="btn-text">登 入</span>
          <div class="spinner"></div>
        </button>

        <div class="message" id="message"></div>
      </form>

      <div class="footer-note">
        還沒有帳號？請聯繫課程管理員開通
      </div>
    </div>
  </div>

  <script>
    // ============================================
    // 學員帳號列表（請在此新增 / 修改帳號）
    // username 可用帳號或 Email，不區分大小寫
    // ============================================
    const ACCOUNTS = [
      { username: 'admin',      password: 'admin123',  name: '管理員' },
      { username: 'student01',  password: 'xau2024',   name: '學員 01' },
      { username: 'student02',  password: 'gold888',   name: '學員 02' },
      { username: 'student03',  password: 'trade666',  name: '學員 03' },
      { username: 'student04',  password: 'fx2024',    name: '學員 04' },
      { username: 'student05',  password: 'xau8888',   name: '學員 05' },
      { username: 'demo',       password: 'demo1234',  name: '示範帳號' },
      // 新增帳號範例：
      // { username: 'yourname',  password: 'yourpass',  name: '顯示名稱' },
    ];

    // 密碼顯示/隱藏
    const passwordInput = document.getElementById('password');
    const toggleBtn = document.getElementById('togglePassword');
    const eyeIcon = document.getElementById('eyeIcon');

    toggleBtn.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      eyeIcon.innerHTML = isPassword
        ? `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>`
        : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
    });

    // 表單元素
    const form = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');
    const messageEl = document.getElementById('message');
    const usernameInput = document.getElementById('username');
    const rememberCheckbox = document.getElementById('remember');

    // 頁面載入時檢查是否已登入
    function checkAlreadyLoggedIn() {
      const session = sessionStorage.getItem('xauusd_user') || localStorage.getItem('xauusd_user');
      if (session) {
        try {
          const user = JSON.parse(session);
          showMessage(`您已登入為「${user.name}」，正在進入課程...`, 'success');
          setTimeout(() => {
            window.location.href = 'xauusd-dashboard.html';
          }, 1000);
          return;
        } catch (e) {
          sessionStorage.removeItem('xauusd_user');
          localStorage.removeItem('xauusd_user');
        }
      }

      // 記住我：自動填入上次帳號
      const savedUsername = localStorage.getItem('xauusd_remember_username');
      if (savedUsername) {
        usernameInput.value = savedUsername;
        rememberCheckbox.checked = true;
      }
    }

    // 驗證帳號密碼
    function validateLogin(username, password) {
      const lowerUser = username.toLowerCase();
      return ACCOUNTS.find(
        acc => acc.username.toLowerCase() === lowerUser && acc.password === password
      ) || null;
    }

    // 登入成功處理
    function handleLoginSuccess(user, remember) {
      const userData = {
        username: user.username,
        name: user.name,
        loginTime: new Date().toISOString()
      };

      // 儲存登入狀態
      if (remember) {
        localStorage.setItem('xauusd_user', JSON.stringify(userData));
        localStorage.setItem('xauusd_remember_username', user.username);
      } else {
        sessionStorage.setItem('xauusd_user', JSON.stringify(userData));
        localStorage.removeItem('xauusd_remember_username');
      }

      showMessage(`登入成功！歡迎 ${user.name}，正在進入課程...`, 'success');

      setTimeout(() => {
        window.location.href = 'xauusd-dashboard.html';
      }, 1000);
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();

      const username = usernameInput.value.trim();
      const password = passwordInput.value;
      const remember = rememberCheckbox.checked;

      // 清除舊訊息
      messageEl.className = 'message';
      messageEl.textContent = '';

      if (!username || !password) {
        showMessage('請填寫帳號與密碼', 'error');
        return;
      }

      // 顯示 loading
      loginBtn.classList.add('loading');
      loginBtn.disabled = true;

      // 模擬一小段延遲，讓使用者感覺有在驗證
      setTimeout(() => {
        loginBtn.classList.remove('loading');
        loginBtn.disabled = false;

        const user = validateLogin(username, password);

        if (user) {
          handleLoginSuccess(user, remember);
        } else {
          showMessage('帳號或密碼錯誤，請再試一次', 'error');
          passwordInput.value = '';
          passwordInput.focus();
        }
      }, 800);
    });

    function showMessage(text, type) {
      messageEl.textContent = text;
      messageEl.className = `message ${type}`;
    }

    // 忘記密碼提示
    document.getElementById('forgotLink').addEventListener('click', (e) => {
      e.preventDefault();
      alert('請聯繫課程管理員重置密碼。');
    });

    // 初始化
    checkAlreadyLoggedIn();
  </script>

</body>
</html>
